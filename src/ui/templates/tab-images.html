<div class="naist-section">
    <b data-i18n="naist.images.inline"></b>
    <div class="naist-hint" data-i18n="naist.images.inlineHint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="inline.saveToServer" /><span data-i18n="naist.images.saveToServer"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="inline.keepBrowserCopy" /><span
            data-i18n="naist.images.keepBrowserCopy"
        ></span
    ></label>
    <div class="naist-grid3">
        <div>
            <label for="naist_img_width" data-i18n="naist.inline.width"></label>
            <input id="naist_img_width" type="number" min="5" class="text_pole" data-setting="inline.defaultWidth" />
        </div>
        <div>
            <label for="naist_img_unit" data-i18n="naist.inline.unit"></label>
            <select id="naist_img_unit" class="text_pole" data-setting="inline.defaultWidthUnit">
                <option value="%">%</option>
                <option value="px">px</option>
            </select>
        </div>
        <div>
            <label for="naist_img_align" data-i18n="naist.inline.align"></label>
            <select id="naist_img_align" class="text_pole" data-setting="inline.defaultAlign">
                <option value="center" data-i18n="naist.inline.alignCenter"></option>
                <option value="left" data-i18n="naist.inline.alignLeft"></option>
                <option value="right" data-i18n="naist.inline.alignRight"></option>
            </select>
        </div>
        <div>
            <label for="naist_img_radius" data-i18n="naist.inline.radius"></label>
            <input id="naist_img_radius" type="number" min="0" class="text_pole" data-setting="inline.defaultRadius" />
        </div>
        <div>
            <label for="naist_img_layout" data-i18n="naist.inline.layout"></label>
            <select id="naist_img_layout" class="text_pole" data-setting="inline.defaultLayout">
                <option value="grid" data-i18n="naist.inline.layoutGrid"></option>
                <option value="carousel" data-i18n="naist.inline.layoutCarousel"></option>
                <option value="list" data-i18n="naist.inline.layoutList"></option>
            </select>
        </div>
        <div>
            <label for="naist_img_llm" data-i18n="naist.images.llmText"></label>
            <select id="naist_img_llm" class="text_pole" data-setting="inline.llmText">
                <option value="describe" data-i18n="naist.images.llmDescribe"></option>
                <option value="remove" data-i18n="naist.images.llmRemove"></option>
            </select>
        </div>
        <div>
            <label for="naist_img_vstrength" data-i18n="naist.images.variationStrength"></label>
            <input
                id="naist_img_vstrength"
                type="number"
                min="0.01"
                max="0.99"
                step="0.01"
                class="text_pole"
                data-setting="inline.variationStrength"
            />
        </div>
        <div>
            <label for="naist_img_vnoise" data-i18n="naist.images.variationNoise"></label>
            <input
                id="naist_img_vnoise"
                type="number"
                min="0"
                max="0.99"
                step="0.01"
                class="text_pole"
                data-setting="inline.variationNoise"
            />
        </div>
    </div>
    <div class="naist-row">
        <div id="naist_img_toggle_chat" class="menu_button"></div>
        <label class="checkbox_label"
            ><input id="naist_img_reading" type="checkbox" /><span data-i18n="naist.images.readingMode"></span
        ></label>
    </div>
</div>

<div class="naist-section">
    <b data-i18n="naist.images.gallery"></b>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="gallery.enabled" /><span data-i18n="naist.images.galleryEnabled"></span
    ></label>
    <div id="naist_img_open_gallery" class="menu_button" data-i18n="naist.images.openGallery"></div>
</div>

<div class="naist-section">
    <b data-i18n="naist.images.png"></b>
    <div class="naist-hint" data-i18n="naist.images.pngHint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="png.stripMetadata" /><span data-i18n="naist.images.stripMetadata"></span
    ></label>
    <div class="naist-row">
        <div id="naist_img_import" class="menu_button" data-i18n="naist.images.importPng"></div>
        <input id="naist_img_import_file" type="file" accept="image/png,image/webp" class="naist-hidden" />
    </div>
</div>
