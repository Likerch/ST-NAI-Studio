<div class="naist-character" data-index="{{index}}">
    <div class="naist-row">
        <label class="checkbox_label"><input type="checkbox" class="naist-char-enabled" {{#if enabled}}checked{{/if}}><span data-i18n="naist.character.enabled"></span></label>
        <span class="naist-muted">#{{number}}</span>
        <div class="menu_button fa-solid fa-trash-can naist-char-remove" data-i18n="[title]naist.character.remove"></div>
    </div>
    <textarea class="text_pole textarea_compact naist-char-prompt" rows="2" data-i18n="[placeholder]naist.character.prompt">{{prompt}}</textarea>
    <input type="text" class="text_pole naist-char-negative" value="{{negative}}" data-i18n="[placeholder]naist.character.negative">
    <div class="naist-grid2 naist-char-position">
        <label><span data-i18n="naist.character.x"></span> <input type="number" class="text_pole naist-char-x" min="0" max="1" step="0.1" value="{{x}}"></label>
        <label><span data-i18n="naist.character.y"></span> <input type="number" class="text_pole naist-char-y" min="0" max="1" step="0.1" value="{{y}}"></label>
    </div>
</div>
