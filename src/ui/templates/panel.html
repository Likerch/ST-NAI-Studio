<div class="naist-panel" id="naist_panel">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="naist.panel.title"></b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="naist-content">
                <div class="naist-row naist-status">
                    <label for="naist_transport_mode" data-i18n="naist.panel.transport"></label>
                    <select id="naist_transport_mode" class="text_pole naist-grow">
                        <option value="auto" data-i18n="naist.transport.auto"></option>
                        <option value="plugin" data-i18n="naist.transport.plugin"></option>
                        <option value="native" data-i18n="naist.transport.native"></option>
                    </select>
                    <div
                        id="naist_refresh"
                        class="menu_button fa-solid fa-rotate"
                        data-i18n="[title]naist.panel.refresh"
                    ></div>
                </div>
                <div id="naist_transport_badge" class="naist-badge"></div>
                <div id="naist_account" class="naist-account"></div>

                <div id="naist_takeover_banner" class="naist-banner naist-hidden">
                    <span data-i18n="naist.takeover.banner"></span>
                    <div id="naist_banner_open" class="menu_button" data-i18n="naist.takeover.bannerAction"></div>
                </div>

                <div class="naist-tabs" role="tablist">
                    <div
                        class="naist-tab menu_button"
                        role="tab"
                        data-tab="generate"
                        data-i18n="naist.tab.generate"
                    ></div>
                    <div
                        class="naist-tab menu_button"
                        role="tab"
                        data-tab="prompts"
                        data-i18n="naist.tab.prompts"
                    ></div>
                    <div class="naist-tab menu_button" role="tab" data-tab="chat" data-i18n="naist.tab.chat"></div>
                    <div class="naist-tab menu_button" role="tab" data-tab="images" data-i18n="naist.tab.images"></div>
                    <div
                        class="naist-tab menu_button"
                        role="tab"
                        data-tab="takeover"
                        data-i18n="naist.tab.takeover"
                    ></div>
                </div>

                <div class="naist-tabpanel" data-tabpanel="generate">
                    <label for="naist_model" data-i18n="naist.panel.model"></label>
                    <select id="naist_model" class="text_pole">
                        {{#each models}}
                        <option value="{{id}}" data-i18n="{{nameKey}}"></option>
                        {{/each}}
                    </select>

                    <label for="naist_prompt" data-i18n="naist.panel.prompt"></label>
                    <textarea
                        id="naist_prompt"
                        class="text_pole textarea_compact"
                        rows="4"
                        data-i18n="[placeholder]naist.panel.promptPlaceholder"
                    ></textarea>

                    <label for="naist_negative" data-i18n="naist.panel.negative"></label>
                    <textarea id="naist_negative" class="text_pole textarea_compact" rows="2"></textarea>
                    <div id="naist_negative_style" class="naist-hint"></div>

                    <div class="naist-grid2">
                        <div>
                            <label for="naist_uc_preset" data-i18n="naist.panel.ucPreset"></label>
                            <select id="naist_uc_preset" class="text_pole"></select>
                        </div>
                        <div>
                            <label for="naist_quality" data-i18n="naist.panel.quality"></label>
                            <select id="naist_quality" class="text_pole"></select>
                        </div>
                    </div>

                    <div
                        id="naist_characters_block"
                        class="naist-block"
                        data-cap="characters"
                        data-feature="characters"
                    >
                        <div class="naist-row">
                            <b data-i18n="naist.panel.characters"></b>
                            <span id="naist_characters_count" class="naist-muted"></span>
                            <div
                                id="naist_add_character"
                                class="menu_button fa-solid fa-user-plus"
                                data-i18n="[title]naist.panel.addCharacter"
                            ></div>
                        </div>
                        <label class="checkbox_label"
                            ><input type="checkbox" id="naist_use_coords" /><span
                                data-i18n="naist.panel.useCoords"
                            ></span
                        ></label>
                        <div id="naist_characters"></div>
                        <div class="naist-feature-hint" data-hint-for="characters"></div>
                    </div>

                    <label for="naist_size_preset" data-i18n="naist.panel.size"></label>
                    <div class="naist-grid3">
                        <select id="naist_size_preset" class="text_pole"></select>
                        <input
                            id="naist_width"
                            type="number"
                            class="text_pole"
                            step="64"
                            min="64"
                            data-i18n="[title]naist.panel.width"
                        />
                        <input
                            id="naist_height"
                            type="number"
                            class="text_pole"
                            step="64"
                            min="64"
                            data-i18n="[title]naist.panel.height"
                        />
                    </div>

                    <div class="naist-grid2">
                        <div>
                            <label for="naist_sampler" data-i18n="naist.panel.sampler"></label>
                            <select id="naist_sampler" class="text_pole"></select>
                        </div>
                        <div data-cap="noiseSchedule">
                            <label for="naist_schedule" data-i18n="naist.panel.schedule"></label>
                            <select id="naist_schedule" class="text_pole"></select>
                        </div>
                    </div>
                    <div class="naist-grid3">
                        <div>
                            <label for="naist_steps" data-i18n="naist.panel.steps"></label>
                            <input id="naist_steps" type="number" min="1" max="50" class="text_pole" />
                        </div>
                        <div>
                            <label for="naist_scale" data-i18n="naist.panel.scale"></label>
                            <input id="naist_scale" type="number" step="0.1" min="0" max="10" class="text_pole" />
                        </div>
                        <div data-feature="cfgRescale">
                            <label for="naist_cfg_rescale" data-i18n="naist.panel.cfgRescale"></label>
                            <input id="naist_cfg_rescale" type="number" step="0.02" min="0" max="1" class="text_pole" />
                        </div>
                    </div>
                    <div class="naist-grid2">
                        <div>
                            <label for="naist_seed" data-i18n="naist.panel.seed"></label>
                            <input
                                id="naist_seed"
                                type="number"
                                min="-1"
                                class="text_pole"
                                data-i18n="[title]naist.panel.seedHint"
                            />
                        </div>
                        <div data-feature="multipleSamples">
                            <label for="naist_samples" data-i18n="naist.panel.samples"></label>
                            <input id="naist_samples" type="number" min="1" max="8" class="text_pole" />
                        </div>
                    </div>
                    <div class="naist-feature-hint" data-hint-for="multipleSamples"></div>

                    <div class="naist-flags">
                        <label class="checkbox_label" data-cap="smea"
                            ><input type="checkbox" id="naist_smea" /><span data-i18n="naist.panel.smea"></span
                        ></label>
                        <label class="checkbox_label" data-cap="smeaDyn"
                            ><input type="checkbox" id="naist_smea_dyn" /><span data-i18n="naist.panel.smeaDyn"></span
                        ></label>
                        <label class="checkbox_label" data-cap="autoSmea"
                            ><input type="checkbox" id="naist_auto_smea" /><span data-i18n="naist.panel.autoSmea"></span
                        ></label>
                        <label class="checkbox_label" data-cap="decrisper"
                            ><input type="checkbox" id="naist_decrisper" /><span
                                data-i18n="naist.panel.decrisper"
                            ></span
                        ></label>
                        <label class="checkbox_label" data-cap="varietyBoost"
                            ><input type="checkbox" id="naist_variety" /><span data-i18n="naist.panel.variety"></span
                        ></label>
                        <label class="checkbox_label" data-cap="transparency" data-feature="transparency"
                            ><input type="checkbox" id="naist_transparent" /><span
                                data-i18n="naist.panel.transparent"
                            ></span
                        ></label>
                        <label class="checkbox_label" data-cap="legacyUc"
                            ><input type="checkbox" id="naist_legacy_uc" /><span data-i18n="naist.panel.legacyUc"></span
                        ></label>
                    </div>
                    <div class="naist-feature-hint" data-hint-for="transparency"></div>

                    <hr />
                    <label class="checkbox_label"
                        ><input type="checkbox" id="naist_free_only" /><span data-i18n="naist.panel.freeOnly"></span
                    ></label>
                    <div id="naist_cost" class="naist-cost"></div>
                    <div id="naist_lost" class="naist-hint"></div>

                    <details class="naist-override">
                        <summary data-i18n="naist.panel.override"></summary>
                        <div class="naist-warning" data-i18n="naist.panel.overrideWarning"></div>
                        <label class="checkbox_label"
                            ><input type="checkbox" id="naist_override_enabled" /><span
                                data-i18n="naist.panel.overrideEnable"
                            ></span
                        ></label>
                        <textarea
                            id="naist_override_json"
                            class="text_pole textarea_compact monospace"
                            rows="4"
                        ></textarea>
                    </details>
                </div>
                <div class="naist-tabpanel naist-hidden" data-tabpanel="prompts"></div>
                <div class="naist-tabpanel naist-hidden" data-tabpanel="chat"></div>
                <div class="naist-tabpanel naist-hidden" data-tabpanel="images"></div>
                <div class="naist-tabpanel naist-hidden" data-tabpanel="takeover"></div>

                <label class="checkbox_label"
                    ><input type="checkbox" id="naist_inspect_before" /><span
                        data-i18n="naist.panel.inspectBeforeSend"
                    ></span
                ></label>
                <div class="naist-row naist-actions">
                    <div id="naist_inspect" class="menu_button menu_button_icon">
                        <i class="fa-solid fa-magnifying-glass"></i><span data-i18n="naist.panel.inspect"></span>
                    </div>
                    <div id="naist_generate" class="menu_button menu_button_icon">
                        <i class="fa-solid fa-paintbrush"></i><span data-i18n="naist.panel.generate"></span>
                    </div>
                    <div id="naist_cancel" class="menu_button menu_button_icon naist-hidden">
                        <i class="fa-solid fa-stop"></i><span data-i18n="naist.panel.cancel"></span>
                    </div>
                </div>
                <div id="naist_message" class="naist-message"></div>
            </div>
        </div>
    </div>
</div>
