<div class="naist-section">
    <b data-i18n="naist.scene.title"></b>
    <div class="naist-hint" data-i18n="naist.scene.hint"></div>
    <div class="naist-row">
        <div id="naist_open_composer" class="menu_button" data-i18n="naist.scene.openComposer"></div>
        <div id="naist_edit_char_passport" class="menu_button" data-i18n="naist.scene.charPassport"></div>
        <div id="naist_edit_persona_passport" class="menu_button" data-i18n="naist.scene.personaPassport"></div>
        <div id="naist_open_pose_library" class="menu_button" data-i18n="naist.scene.poseLibrary"></div>
    </div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="scene.allowNsfw" /><span data-i18n="naist.composer.allowNsfw"></span
    ></label>
    <label for="naist_explicit_negative" data-i18n="naist.scene.explicitNegative"></label>
    <textarea
        id="naist_explicit_negative"
        class="text_pole textarea_compact"
        rows="2"
        data-setting="scene.explicitNegative"
    ></textarea>
    <div class="naist-hint" data-i18n="naist.scene.explicitNegativeHint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="scene.llmBase" /><span data-i18n="naist.scene.llmBase"></span
    ></label>
</div>

<div id="naist_style_editor" class="naist-section">
    <div class="naist-row">
        <b data-i18n="naist.prompts.styles"></b>
        <span
            id="naist_style_dirty"
            class="naist-badge naist-badge-warn naist-hidden"
            data-i18n="naist.prompts.styleChanged"
        ></span>
    </div>
    <div class="naist-row">
        <select id="naist_style" class="text_pole naist-grow"></select>
        <div id="naist_style_new" class="menu_button fa-solid fa-plus" data-i18n="[title]naist.prompts.styleNew"></div>
        <div
            id="naist_style_rename"
            class="menu_button fa-solid fa-pencil"
            data-i18n="[title]naist.prompts.styleRename"
        ></div>
        <div
            id="naist_style_delete"
            class="menu_button fa-solid fa-trash-can"
            data-i18n="[title]naist.prompts.styleDelete"
        ></div>
    </div>
    <div id="naist_style_status" class="naist-hint"></div>
    <label id="naist_prefix_label" for="naist_prefix" data-i18n="naist.prompts.prefix"></label>
    <textarea id="naist_prefix" class="text_pole textarea_compact" rows="2" data-setting="prompts.prefix"></textarea>
    <label id="naist_suffix_label" for="naist_suffix" data-i18n="naist.prompts.suffix"></label>
    <textarea id="naist_suffix" class="text_pole textarea_compact" rows="2" data-setting="prompts.suffix"></textarea>
    <div class="naist-hint" data-i18n="naist.prompts.prefixHint"></div>
    <label id="naist_style_negative_label" for="naist_style_negative" data-i18n="naist.prompts.commonNegative"></label>
    <textarea id="naist_style_negative" class="text_pole textarea_compact" rows="2"></textarea>
    <div class="naist-grid2">
        <div id="naist_style_mode_box">
            <label for="naist_style_mode" data-i18n="naist.prompts.negativeMode"></label>
            <select id="naist_style_mode" class="text_pole">
                <option value="replace" data-i18n="naist.prompts.negativeModeReplace"></option>
                <option value="append" data-i18n="naist.prompts.negativeModeAppend"></option>
            </select>
        </div>
        <div>
            <label id="naist_style_uc_label" for="naist_style_uc" data-i18n="naist.panel.ucPreset"></label>
            <select id="naist_style_uc" class="text_pole"></select>
        </div>
    </div>
    <div id="naist_style_effective_box" class="naist-hidden">
        <label for="naist_style_effective" data-i18n="naist.prompts.effectiveNegative"></label>
        <div id="naist_style_effective" class="naist-pre naist-style-effective"></div>
    </div>
    <div id="naist_style_actions" class="naist-row naist-hidden">
        <div id="naist_style_save" class="menu_button" data-i18n="naist.prompts.styleSave"></div>
        <div id="naist_style_revert" class="menu_button" data-i18n="naist.prompts.styleRevert"></div>
    </div>
    <label for="naist_base_negative" data-i18n="naist.prompts.baseNegative"></label>
    <textarea id="naist_base_negative" class="text_pole textarea_compact" rows="2"></textarea>
    <div class="naist-hint" data-i18n="naist.prompts.baseNegativeHint"></div>
    <div class="naist-hint" data-i18n="naist.prompts.stylesHint"></div>
</div>

<div class="naist-section">
    <b data-i18n="naist.language.title"></b>
    <div class="naist-hint" data-i18n="naist.language.hint"></div>
    <div class="naist-grid2">
        <div>
            <label for="naist_language_mode" data-i18n="naist.language.mode"></label>
            <select id="naist_language_mode" class="text_pole" data-setting="language.mode">
                <option value="auto" data-i18n="naist.language.modeAuto"></option>
                <option value="always" data-i18n="naist.language.modeAlways"></option>
                <option value="off" data-i18n="naist.language.modeOff"></option>
            </select>
        </div>
        <div>
            <label for="naist_language_backend" data-i18n="naist.language.backend"></label>
            <select id="naist_language_backend" class="text_pole" data-setting="language.backend">
                <option value="main" data-i18n="naist.language.backendMain"></option>
                <option value="profile" data-i18n="naist.language.backendProfile"></option>
                <option value="novelai" data-i18n="naist.language.backendNovelai"></option>
            </select>
        </div>
    </div>
    <div id="naist_language_profile_row" class="naist-hidden">
        <label for="naist_language_profile" data-i18n="naist.language.profile"></label>
        <select id="naist_language_profile" class="text_pole" data-setting="language.profileId"></select>
        <div class="naist-hint" data-i18n="naist.language.profileHint"></div>
    </div>
    <div id="naist_language_novelai_row" class="naist-hidden">
        <label for="naist_language_novelai_model" data-i18n="naist.language.novelaiModel"></label>
        <select id="naist_language_novelai_model" class="text_pole" data-setting="language.novelaiModel">
            <option value="glm-4-6">GLM-4.6</option>
            <option value="xialong-v1">Xialong (Opus)</option>
        </select>
        <div class="naist-hint" data-i18n="naist.language.novelaiHint"></div>
    </div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="language.russianOnV5" /><span
            data-i18n="naist.language.russianOnV5"
        ></span
    ></label>
    <label for="naist_language_test" data-i18n="naist.language.test"></label>
    <textarea
        id="naist_language_test"
        class="text_pole textarea_compact"
        rows="2"
        data-i18n="[placeholder]naist.language.testPlaceholder"
    ></textarea>
    <div class="naist-row">
        <div id="naist_language_test_run" class="menu_button" data-i18n="naist.language.testRun"></div>
    </div>
    <pre id="naist_language_test_result" class="naist-pre naist-hidden"></pre>
    <label for="naist_glossary" data-i18n="naist.translate.glossary"></label>
    <textarea
        id="naist_glossary"
        class="text_pole textarea_compact"
        rows="4"
        data-i18n="[placeholder]naist.translate.glossaryPlaceholder"
    ></textarea>
    <div class="naist-hint" data-i18n="naist.translate.glossaryHint"></div>
</div>

<div class="naist-section">
    <b data-i18n="naist.tags.title"></b>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="promptTools.autocomplete" /><span
            data-i18n="naist.tags.autocomplete"
        ></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="promptTools.remoteSuggest" /><span data-i18n="naist.tags.remote"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="promptTools.warnUnknown" /><span data-i18n="naist.tags.warnUnknown"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="promptTools.counter" /><span data-i18n="naist.tokens.enable"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="promptTools.convertWeights" /><span data-i18n="naist.weights.auto"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="generation.autoText" /><span data-i18n="naist.tokens.autoText"></span
    ></label>
    <div class="naist-hint" data-i18n="naist.weights.hint"></div>
</div>

<div id="naist_char_prompt_block" class="naist-section">
    <b data-i18n="naist.prompts.characterPrompt"></b> <span id="naist_char_prompt_name" class="naist-muted"></span>
    <textarea
        id="naist_char_positive"
        class="text_pole textarea_compact"
        rows="2"
        data-i18n="[placeholder]naist.prompts.characterPositive"
    ></textarea>
    <textarea
        id="naist_char_negative"
        class="text_pole textarea_compact"
        rows="2"
        data-i18n="[placeholder]naist.prompts.characterNegative"
    ></textarea>
    <label class="checkbox_label"
        ><input type="checkbox" id="naist_char_share" /><span data-i18n="naist.prompts.characterShare"></span
    ></label>
</div>
<div id="naist_char_prompt_none" class="naist-hint naist-hidden" data-i18n="naist.prompts.characterNone"></div>

<details class="naist-section">
    <summary data-i18n="naist.prompts.templates"></summary>
    <div class="naist-hint" data-i18n="naist.prompts.templatesHint"></div>
    <div id="naist_templates"></div>
</details>

<div class="naist-section">
    <b data-i18n="naist.io.title"></b>
    <div class="naist-hint" data-i18n="naist.io.hint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" id="naist_settings_images" checked /><span data-i18n="naist.io.includeImages"></span
    ></label>
    <div class="naist-row">
        <div id="naist_settings_export" class="menu_button" data-i18n="naist.io.export"></div>
        <div id="naist_settings_import" class="menu_button" data-i18n="naist.io.import"></div>
        <input id="naist_settings_file" type="file" accept=".json,application/json" class="naist-hidden" />
    </div>
</div>
