<div class="naist-section">
    <b data-i18n="naist.chat.visibility"></b>
    <div class="naist-hint" data-i18n="naist.chat.visibilityHint"></div>
    <div class="naist-flags">
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="chat.visibility.panel" /><span
                data-i18n="naist.initiator.panel"
            ></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="chat.visibility.command" /><span
                data-i18n="naist.initiator.command"
            ></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="chat.visibility.wand" /><span data-i18n="naist.initiator.wand"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="chat.visibility.interactive" /><span
                data-i18n="naist.initiator.interactive"
            ></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="chat.visibility.tool" /><span data-i18n="naist.initiator.tool"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="chat.visibility.auto" /><span data-i18n="naist.initiator.auto"></span
        ></label>
    </div>
    <div class="naist-grid2">
        <div>
            <label for="naist_author" data-i18n="naist.chat.author"></label>
            <select id="naist_author" class="text_pole" data-setting="chat.author">
                <option value="character" data-i18n="naist.chat.authorCharacter"></option>
                <option value="user" data-i18n="naist.chat.authorUser"></option>
            </select>
        </div>
        <div>
            <label for="naist_confirm_above" data-i18n="naist.chat.confirmAbove"></label>
            <input id="naist_confirm_above" type="number" min="0" class="text_pole" data-setting="anlas.confirmAbove" />
        </div>
    </div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="chat.hidePrompt" /><span data-i18n="naist.chat.hidePrompt"></span
    ></label>
</div>

<div class="naist-section">
    <b data-i18n="naist.chat.prompting"></b>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="modes.refine" /><span data-i18n="naist.chat.refine"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="modes.multimodal" /><span data-i18n="naist.chat.multimodal"></span
    ></label>
    <div class="naist-grid2 naist-mm-source">
        <div>
            <label for="naist_mm_api" data-i18n="naist.multimodal.api"></label>
            <select id="naist_mm_api" class="text_pole" data-setting="modes.multimodalApi"></select>
        </div>
        <div>
            <label for="naist_mm_model" data-i18n="naist.multimodal.model"></label>
            <input id="naist_mm_model" class="text_pole" data-setting="modes.multimodalModel" />
        </div>
    </div>
    <div class="naist-hint" id="naist_mm_hint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="modes.freeExtend" /><span data-i18n="naist.chat.freeExtend"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="modes.snap" /><span data-i18n="naist.chat.snap"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="modes.minimalProcessing" /><span
            data-i18n="naist.chat.minimalProcessing"
        ></span
    ></label>
</div>

<div class="naist-section">
    <b data-i18n="naist.chat.llm"></b>
    <div class="naist-hint" data-i18n="naist.chat.llmHint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="chat.interactive" /><span data-i18n="naist.chat.interactive"></span
    ></label>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="chat.functionTool" /><span data-i18n="naist.chat.functionTool"></span
    ></label>
    <label for="naist_tool_cooldown" data-i18n="naist.chat.toolCooldown"></label>
    <input id="naist_tool_cooldown" type="number" min="0" class="text_pole" data-setting="chat.toolCooldownSeconds" />
</div>

<div class="naist-section">
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="auto.enabled" /><b data-i18n="naist.auto.enabled"></b
    ></label>
    <div class="naist-hint" data-i18n="naist.auto.guardHint"></div>
    <label for="naist_auto_mode" data-i18n="naist.auto.mode"></label>
    <select id="naist_auto_mode" class="text_pole" data-setting="auto.mode" data-type="number"></select>
    <div class="naist-grid2">
        <div>
            <label for="naist_auto_every" data-i18n="naist.auto.everyMessages"></label>
            <input id="naist_auto_every" type="number" min="0" class="text_pole" data-setting="auto.everyMessages" />
        </div>
        <div>
            <label for="naist_auto_cooldown_messages" data-i18n="naist.auto.cooldownMessages"></label>
            <input
                id="naist_auto_cooldown_messages"
                type="number"
                min="1"
                class="text_pole"
                data-setting="auto.cooldownMessages"
            />
        </div>
    </div>
    <label for="naist_auto_keywords" data-i18n="naist.auto.keywords"></label>
    <input id="naist_auto_keywords" type="text" class="text_pole" data-setting="auto.keywords" />
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="auto.sceneChange" /><span data-i18n="naist.auto.sceneChange"></span
    ></label>
    <input
        id="naist_auto_markers"
        type="text"
        class="text_pole"
        data-setting="auto.sceneMarkers"
        data-i18n="[title]naist.auto.sceneMarkers"
    />
    <label for="naist_auto_cooldown_seconds" data-i18n="naist.auto.cooldownSeconds"></label>
    <input
        id="naist_auto_cooldown_seconds"
        type="number"
        min="0"
        class="text_pole"
        data-setting="auto.cooldownSeconds"
    />
    <label class="checkbox_label"
        ><input type="checkbox" id="naist_auto_allow_paid" data-setting="auto.allowPaid" /><span
            data-i18n="naist.auto.allowPaid"
        ></span
    ></label>
</div>

<div class="naist-section" id="naist_markers_section">
    <b data-i18n="naist.markers.title"></b>
    <div class="naist-hint" data-i18n="naist.markers.hint"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="markers.enabled" /><span data-i18n="naist.markers.enabled"></span
    ></label>
    <div class="naist-markers-options">
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="markers.inject" /><span data-i18n="naist.markers.inject"></span
        ></label>
        <div class="naist-grid2">
            <div>
                <label for="naist_markers_preset" data-i18n="naist.markers.preset"></label>
                <select id="naist_markers_preset" class="text_pole" data-setting="markers.preset">
                    <option value="natural" data-i18n="naist.markers.presetNatural"></option>
                    <option value="tags" data-i18n="naist.markers.presetTags"></option>
                    <option value="custom" data-i18n="naist.markers.presetCustom"></option>
                </select>
            </div>
            <div>
                <label for="naist_markers_caption_lang" data-i18n="naist.markers.captionLanguage"></label>
                <input id="naist_markers_caption_lang" class="text_pole" data-setting="markers.captionLanguage" />
            </div>
        </div>
        <div id="naist_markers_custom" class="naist-hidden">
            <label for="naist_markers_template" data-i18n="naist.markers.template"></label>
            <textarea
                id="naist_markers_template"
                class="text_pole textarea_compact"
                rows="8"
                data-setting="markers.template"
            ></textarea>
            <div class="naist-hint" data-i18n="naist.markers.templateHint"></div>
            <div
                id="naist_markers_template_default"
                class="menu_button"
                data-i18n="naist.markers.templateDefault"
            ></div>
        </div>
        <div class="naist-grid2">
            <div>
                <label for="naist_markers_min" data-i18n="naist.markers.min"></label>
                <input
                    id="naist_markers_min"
                    type="number"
                    min="0"
                    max="10"
                    class="text_pole"
                    data-setting="markers.min"
                />
            </div>
            <div>
                <label for="naist_markers_max" data-i18n="naist.markers.max"></label>
                <input
                    id="naist_markers_max"
                    type="number"
                    min="0"
                    max="10"
                    class="text_pole"
                    data-setting="markers.max"
                />
            </div>
            <div>
                <label for="naist_markers_depth" data-i18n="naist.markers.depth"></label>
                <input
                    id="naist_markers_depth"
                    type="number"
                    min="0"
                    max="100"
                    class="text_pole"
                    data-setting="markers.depth"
                />
            </div>
            <div>
                <label for="naist_markers_role" data-i18n="naist.markers.role"></label>
                <select id="naist_markers_role" class="text_pole" data-setting="markers.role">
                    <option value="system" data-i18n="naist.markers.roleSystem"></option>
                    <option value="user" data-i18n="naist.markers.roleUser"></option>
                    <option value="assistant" data-i18n="naist.markers.roleAssistant"></option>
                </select>
            </div>
        </div>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="markers.earlyStart" /><span
                data-i18n="naist.markers.earlyStart"
            ></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="markers.autoFill" /><span data-i18n="naist.markers.autoFill"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="markers.legacy" /><span data-i18n="naist.markers.legacy"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="inline.regexCompat" /><span
                data-i18n="naist.markers.regexCompat"
            ></span
        ></label>
        <div class="naist-row">
            <label class="checkbox_label"
                ><input id="naist_markers_allow_paid" type="checkbox" data-setting="markers.allowPaid" /><span
                    data-i18n="naist.markers.allowPaid"
                ></span
            ></label>
            <input
                id="naist_markers_max_cost"
                type="number"
                min="0"
                class="text_pole naist-narrow"
                data-setting="markers.maxCost"
                data-i18n="[title]naist.markers.maxCost"
            />
        </div>
        <div id="naist_markers_preview" class="menu_button" data-i18n="naist.markers.preview"></div>
    </div>
</div>

<div class="naist-section" id="naist_des_section">
    <b data-i18n="naist.des.title"></b>
    <div class="naist-hint" data-i18n="naist.des.hint"></div>
    <div class="naist-muted" id="naist_des_status"></div>
    <label class="checkbox_label"
        ><input type="checkbox" data-setting="des.enabled" /><span data-i18n="naist.des.enabled"></span
    ></label>
    <div class="naist-des-options">
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.sceneTags" /><span data-i18n="naist.des.sceneTags"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.characters" /><span data-i18n="naist.des.characters"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.autoPassports" /><span data-i18n="naist.des.autoPassports"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.portraits" /><span data-i18n="naist.des.portraits"></span
        ></label>
        <div class="naist-grid2">
            <div>
                <label for="naist_des_policy" data-i18n="naist.des.policy"></label>
                <select id="naist_des_policy" class="text_pole" data-setting="des.portraitPolicy">
                    <option value="missing" data-i18n="naist.des.policyMissing"></option>
                    <option value="state" data-i18n="naist.des.policyState"></option>
                    <option value="every" data-i18n="naist.des.policyEvery"></option>
                </select>
            </div>
            <div>
                <label for="naist_des_framing" data-i18n="naist.des.framing"></label>
                <input id="naist_des_framing" class="text_pole" data-setting="des.portraitTags" />
            </div>
        </div>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.emotionsToDes" /><span data-i18n="naist.des.emotionsToDes"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.menu" /><span data-i18n="naist.des.menu"></span
        ></label>
        <label class="checkbox_label"
            ><input type="checkbox" data-setting="des.banners" /><span data-i18n="naist.des.banners"></span
        ></label>
        <div id="naist_des_passports" class="menu_button">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="naist.des.passportsButton"></span>
        </div>
    </div>
</div>

<div class="naist-section naist-hidden" id="naist_quality_section">
    <b data-i18n="naist.quality.title"></b>
    <div class="naist-hint" data-i18n="naist.quality.hint"></div>
    <label for="naist_quality_timeout" data-i18n="naist.quality.timeout"></label>
    <input id="naist_quality_timeout" type="number" min="1" max="600" step="1" class="text_pole" />
</div>
